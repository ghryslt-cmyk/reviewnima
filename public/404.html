<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ReviewNima</title>
    <script>
      // Redirect all 404 errors to index.html for client-side routing
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?p=' +
          l.pathname.slice(1)
      );
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0;url=/" />
    </noscript>
    <h1>Redirecting...</h1>
  </body>
</html>
