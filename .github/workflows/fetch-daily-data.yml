name: Fetch Daily Anime Data

on:
  schedule:
    # Run every day at 23:00 UTC to fetch data for the next day
    - cron: '0 23 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-daily-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch trending anime data
        run: node scripts/fetch-trending-anime.js
      
      - name: Fetch MAL schedule data
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: node scripts/fetch-mal-schedule.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/daily/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily anime data [automated]"
          git push
