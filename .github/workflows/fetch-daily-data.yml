name: Fetch Seasonal Anime Data

on:
  schedule:
    # Run at the start of each season
    # Winter: January 1st at 00:00 UTC
    # Spring: April 1st at 00:00 UTC
    # Summer: July 1st at 00:00 UTC
    # Fall: October 1st at 00:00 UTC
    - cron: '0 0 1 1 *'   # January 1 (Winter)
    - cron: '0 0 1 4 *'   # April 1 (Spring)
    - cron: '0 0 1 7 *'   # July 1 (Summer)
    - cron: '0 0 1 10 *'  # October 1 (Fall)
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-seasonal-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch trending anime data
        run: node scripts/fetch-trending-anime.js
      
      - name: Fetch MAL schedule data
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: node scripts/fetch-mal-schedule.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/daily/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seasonal anime data [automated]"
          git push
