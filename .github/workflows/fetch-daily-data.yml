name: Fetch Daily Data

on:
  schedule:
    # Run every 15 minutes to ensure regular updates even if some runs are delayed
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: fetch-daily-data
  cancel-in-progress: true

jobs:
  fetch-seasonal-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Fetch trending anime and news data
        run: node scripts/fetch-hourly.js

      - name: Fetch MAL schedule data
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: node scripts/fetch-mal-schedule.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f public/data/daily/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily data [automated]"
          git push
